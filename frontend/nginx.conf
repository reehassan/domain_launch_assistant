server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing — any path that isn't a
    # real static file needs to fall back to index.html so the browser
    # loads the app shell and React Router takes over from there.
    # Without this, refreshing on any route other than "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}